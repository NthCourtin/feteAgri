<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code secret</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#1b1b1b,#000);
    color:white;
    font-family:Arial, Helvetica, sans-serif;
    overflow:hidden;
}

.card{
    text-align:center;
    padding:40px;
    border-radius:20px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(10px);
    box-shadow:0 0 30px rgba(0,0,0,.6);
    width:90%;
    max-width:450px;
}

h1{
    margin-bottom:20px;
    font-size:2em;
}

#message{
    font-size:1.2em;
    margin:20px 0;
}

#countdown{
    font-size:80px;
    font-weight:bold;
    color:#FFD54A;
    animation:pulse 1s infinite;
}

#code{
    display:none;
    font-size:70px;
    font-weight:bold;
    letter-spacing:12px;
    color:#00ff88;
    margin:20px 0;
    animation:zoom .7s ease;
}

button{
    display:none;
    padding:15px 35px;
    border:none;
    border-radius:40px;
    background:#FFD54A;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.05);
}

@keyframes pulse{
    50%{transform:scale(1.15);}
}

@keyframes zoom{
    from{
        transform:scale(.2);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}
</style>

</head>
<body>

<div class="card">

<h1>🔒 Accès au code secret</h1>

<div id="message">
Analyse en cours...
</div>

<div id="countdown">5</div>

<div id="code">
762
</div>

</div>

<script>

let n=5;

const countdown=document.getElementById("countdown");
const code=document.getElementById("code");
const message=document.getElementById("message");
const button=document.querySelector("button");

const interval=setInterval(()=>{

    n--;

    if(n>0){
        countdown.innerHTML=n;

        if(n==4) message.innerHTML="🔍 Recherche du code...";
        if(n==3) message.innerHTML="📡 Vérification...";
        if(n==2) message.innerHTML="🔐 Déchiffrement...";
        if(n==1) message.innerHTML="✨ Presque terminé...";
    }

    if(n==0){

        clearInterval(interval);

        countdown.style.display="none";

        message.innerHTML="🎉 Félicitations ! Votre code est :";

        code.style.display="block";

        button.style.display="inline-block";
    }

},1000);

</script>

</body>
</html>
