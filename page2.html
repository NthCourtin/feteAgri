<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Accès refusé</title>

<style>

html, body {
  height: 100%;
}

body {
  margin: 0;
  background: #020202;
  color: #7CFF7C;
  font-family: Consolas, monospace;
  overflow-y: auto;
  overflow-x: hidden;
}

#container {
  width: 92%;
  max-width: 900px;
  margin: auto;
  padding-top: 30px;
  padding-bottom: 60px;
  box-sizing: border-box;
}

@keyframes glitch {
  0%, 100% {
    text-shadow: 2px 0 #ff4444, -2px 0 #55ff55;
    transform: translate(0, 0);
  }
  20% {
    text-shadow: -2px 0 #ff4444, 2px 0 #55ff55;
    transform: translate(-2px, 1px);
  }
  40% {
    text-shadow: 2px 0 #ff4444, -2px 0 #55ff55;
    transform: translate(2px, -1px);
  }
  60% {
    text-shadow: -1px 0 #ff4444, 1px 0 #55ff55;
    transform: translate(-1px, 0);
  }
  80% {
    text-shadow: 1px 0 #ff4444, -1px 0 #55ff55;
    transform: translate(1px, 1px);
  }
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-4px); }
  40% { transform: translateX(4px); }
  60% { transform: translateX(-3px); }
  80% { transform: translateX(3px); }
}

@keyframes flicker {
  0%, 19%, 21%, 100% { opacity: 1; }
  20% { opacity: 0.4; }
}

@keyframes staticNoise {
  0% { background-position: 0 0; }
  100% { background-position: 200px 200px; }
}

.glitch {
  color: #ff4444;
  text-align: center;
  animation: glitch 1.2s infinite, shake 3.5s infinite;
  letter-spacing: 1px;
  font-size: clamp(22px, 7vw, 40px);
  line-height: 1.3;
  word-wrap: break-word;
}

#alert-text {
  text-align: center;
  font-size: clamp(20px, 6vw, 30px);
  color: #ff2222;
  margin-top: 25px;
  animation: flicker 2.5s infinite;
}

#hint {
  text-align: center;
  margin-top: 35px;
  font-size: clamp(15px, 4vw, 18px);
  color: #ff8888;
  line-height: 1.6;
  padding: 0 10px;
}

.cursor {
  display: inline-block;
  width: 10px;
  background: #7CFF7C;
  animation: blink .7s infinite;
}

@keyframes blink {
  50% { opacity: 0; }
}

#static {
  height: 4px;
  width: 100%;
  margin-top: 25px;
  background: repeating-linear-gradient(
    90deg,
    #ff4444 0px,
    #ff4444 3px,
    transparent 3px,
    transparent 6px
  );
  opacity: 0.6;
  animation: staticNoise 0.4s linear infinite;
}

</style>

</head>

<body>

<div id="container">

<h1 class="glitch" data-text="⛔ ACCÈS REFUSÉ">⛔ ACCÈS REFUSÉ</h1>

<div id="alert-text">Mauvaise réponse<span class="cursor"></span></div>

<div id="static"></div>

<p id="hint">Le système a détecté une anomalie dans votre réponse.<br>
Retentez votre chance.</p>

</div>

<script>

window.addEventListener("load", function () {

  const container = document.getElementById("container");

  container.style.animation = "shake 0.4s";

  setTimeout(function () {
    container.style.animation = "";
  }, 400);

});

</script>

</body>
</html>
