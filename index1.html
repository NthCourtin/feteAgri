<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Dossier confidentiel</title>

<style>

body{
    margin:0;
    background:#020202;
    color:#7CFF7C;
    font-family:Consolas, monospace;
    overflow:hidden;
}

#container{
    width:90%;
    max-width:900px;
    margin:auto;
    padding-top:40px;
}

h1{
    text-align:center;
    color:#55ff55;
}

#progressBox{

    margin-top:60px;

}

.bar{
    width:100%;
    height:25px;
    border:2px solid #55ff55;
}

#fill{

    width:0%;
    height:100%;
    background:#55ff55;

}

#percent{

    margin-top:15px;
    text-align:center;
    font-size:25px;

}

#content{

display:none;
animation:fade 2s;

}

#key{

display:block;
margin:30px auto;
width:180px;

filter:drop-shadow(0px 0px 15px yellow);

animation:pulse 2s infinite;

}

#text{

font-size:22px;
line-height:1.7;
white-space:pre-wrap;

}

@keyframes pulse{

50%{
transform:scale(1.08);
}

}

@keyframes fade{

from{opacity:0;}
to{opacity:1;}

}

.cursor{

display:inline-block;
width:10px;
background:#7CFF7C;
animation:blink .7s infinite;

}

@keyframes blink{
50%{
opacity:0;
}
}

</style>

</head>

<body>

<div id="container">

<h1>🔒 DOSSIER CONFIDENTIEL</h1>

<div id="progressBox">

<div>Connexion au serveur sécurisé...</div>

<div class="bar">
<div id="fill"></div>
</div>

<div id="percent">0 %</div>

</div>

<div id="content">

<h1>MISSION VALIDÉE</h1>

<p style="text-align:center;font-size:24px;">
🎉 Trop fort !
<br><br>
Dernière ligne droite pour délivrer le monde.
<br>
<strong>Retenez bien ce dernier symbole.</strong>
</p>

<img src="cle.png" id="key">

<div id="text"></div>

</div>

</div>

<script>

let i=0;

const fill=document.getElementById("fill");
const percent=document.getElementById("percent");

const timer=setInterval(function(){

i++;

fill.style.width=i+"%";

percent.innerHTML=i+" %";

if(i>=100){

clearInterval(timer);

document.getElementById("progressBox").style.display="none";

document.getElementById("content").style.display="block";

typeWriter();

}

},35);

const texte=`📜 Message retrouvé

Michel Garausud avait assuré ses arrières.
Bien implanté dans la filière agricole,
il comptait parmi ses proches un célèbre assureur.

Je les ai vus ensemble ce fameux soir de Noël.

Je suis certain qu'ils étaient de mèche.

Ils étaient plongés dans le noir…
et pourtant les formules jaillissaient des murs
comme en plein jour.

Je suis convaincu qu'elles y sont encore.

À vous de les révéler le plus vite possible.

Sous ce soleil et ses UV,
invoquez la lune et la nuit…

Qui sait ce qui apparaîtra ?`;

let n=0;

function typeWriter(){

if(n<texte.length){

document.getElementById("text").innerHTML=
texte.substring(0,n)+"<span class='cursor'></span>";

n++;

setTimeout(typeWriter,28);

}
else{

document.getElementById("text").innerHTML=texte;

}

}

</script>

</body>
</html>
